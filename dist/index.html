<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#F4F1E8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="学习打卡 —— 阅读与计算打卡，让坚持看得见" />
    <title>学习打卡</title>
    
  </head>
  <body>
    <div id="root"></div>
    <script src="./assets/index.js"></script>
    <script>
      // 诊断探针：只在捕获到错误时才显示，正常情况下不出现
      (function () {
        var panel = null, errors = [], startedAt = Date.now();
        window.addEventListener('error', function (e) {
          errors.push('[ERR] ' + (e.message || String(e)) + ' @ ' + (e.filename || '?') + ':' + (e.lineno || '?'));
          try { console.error('[PROBE]', e.message, e); } catch (x) {}
          showPanel();
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          errors.push('[PR] ' + (e.reason && (e.reason.message || e.reason.stack) || String(e.reason)));
        });
        function escape(s) { return String(s).replace(/[<>&]/g, function(c){ return { '<':'&lt;', '>':'&gt;', '&':'&amp;' }[c]; }); }
        function showPanel() {
          if (panel) return;
          panel = document.createElement('div');
          panel.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,245,245,0.97);color:#c00;font:12px monospace;padding:12px;overflow:auto;z-index:2147483647;line-height:1.7;';
          panel.innerHTML = '<h2 style="margin:0 0 8px;color:#c00;">🛠 诊断面板（错误！）</h2>' +
            '<p style="margin:4px 0;color:#666;font-size:11px;">UA: ' + escape((navigator.userAgent||'').slice(0,140)) + '</p>' +
            '<p style="margin:4px 0;color:#666;font-size:11px;">URL: ' + escape(location.href) + '</p>' +
            '<p style="margin:4px 0;color:#666;font-size:11px;">noModule: ' + ('noModule' in HTMLScriptElement.prototype) + '</p>' +
            '<p style="margin:4px 0;color:#666;font-size:11px;">root null: ' + (document.getElementById('root') === null) + '</p>' +
            (errors.length ? '<div style="background:#ffe;border:1px solid #fcc;padding:6px;margin:8px 0;">' + errors.map(function(e){ return '❌ ' + escape(e); }).join('<br>') + '</div>' : '') +
            '<p style="color:#666;margin-top:10px;font-size:11px;">请截图此页面发给开发者</p>';
          document.body.appendChild(panel);
        }
        window.__probe = {
          show: showPanel,
          hide: function () { if (panel) panel.style.display = 'none'; },
        };
      })();
    </script>
  </body>
</html>
